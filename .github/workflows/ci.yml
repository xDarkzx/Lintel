name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: C++ core (GoogleTest, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S test/host -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLINTEL_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  server:
    name: Server (pytest, pip-audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pip-audit
      - run: python -m pytest -q tests
      - run: pip-audit -r requirements.txt

  postgres:
    name: PostgreSQL backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lintel_test
          POSTGRES_USER: lintel_test
          POSTGRES_PASSWORD: lintel_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lintel_test -d lintel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINTEL_TEST_DATABASE_URL: postgresql://lintel_test:lintel_test_only@localhost:5432/lintel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_postgres.py

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  panel:
    name: Keypad firmware (ESP-IDF 5.4)
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - run: . $IDF_PATH/export.sh && idf.py -C firmware/panel set-target esp32p4 build
        shell: bash
