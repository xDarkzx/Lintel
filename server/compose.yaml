services:
  lintel:
    build: .
    image: lintel-server:0.1
    container_name: lintel
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "47800:47800/udp"
    volumes:
      - ./data:/data
    environment:
      TZ: Pacific/Auckland
      # Production: keep the master key out of ./data, as a Docker secret (see BUILDING.md).
      # LINTEL_MASTER_KEY_FILE: /run/secrets/lintel_master_key
    # secrets: [lintel_master_key]
    # Least privilege: nothing writable but /data, no capabilities, no setuid.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
