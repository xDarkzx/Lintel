services:
  lintel:
    build: .
    image: lintel-server:0.1
    container_name: lintel
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "47800:47800/udp"
    volumes:
      - ./data:/data
    environment:
      TZ: Pacific/Auckland
    # Least privilege: nothing writable but /data, no capabilities, no setuid.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
