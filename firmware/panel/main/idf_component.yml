dependencies:
  idf: ">=5.4"
  lvgl/lvgl: "8.4.*"
  # Data link to the door controller over the native high-speed USB-OTG port.
  espressif/esp_tinyusb: "1.7.6~2"
  # Camera: OV02C10 needs esp_cam_sensor 1.2.1 (vendored in components/), which only
  # builds against esp_video 1.1.0. Same pins as infinity_face.
  espressif/esp_video: "==1.1.0"
